name: Build iOSDebugHelper

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Install Theos
        run: |
          sudo git clone --recursive https://github.com/theos/theos.git /opt/theos
          echo "THEOS=/opt/theos" >> $GITHUB_ENV

      - name: Install dpkg
        run: brew install dpkg

      - name: Clone FLEX dependency
        run: |
          mkdir -p Headers
          git clone --depth 1 https://github.com/FLEXTool/FLEX.git Headers/FLEX
          echo "=== FLEX source files ==="
          find Headers/FLEX -name "*.m" ! -name "*Test*" | wc -l

      - name: Build tweak
        run: |
          export THEOS=/opt/theos

          # 收集 FLEX 所有 .m 源文件
          FLEX_SOURCES=$(find Headers/FLEX -name "*.m" ! -name "*Test*" ! -name "main.m" | tr '\n' ' ')
          echo "FLEX sources: $(echo $FLEX_SOURCES | wc -w) files"

          # 动态追加到 Makefile
          echo "iOSDebugHelper_FILES += $FLEX_SOURCES" >> Makefile
          echo "iOSDebugHelper_CFLAGS += -IHeaders/FLEX" >> Makefile

          echo "=== Makefile content ==="
          cat Makefile

          make package THEOS=/opt/theos ARCHS="arm64" 2>&1 | tail -60

      - name: Extract dylib from deb
        if: success()
        run: |
          mkdir -p output
          DEB_FILE=$(ls packages/*.deb | head -1)
          echo "DEB: $DEB_FILE"
          dpkg-deb -x "$DEB_FILE" output/
          echo "=== Files in deb ==="
          find output/ -type f
          DYLIB=$(find output/ -name "*.dylib" | head -1)
          cp "$DYLIB" output/iOSDebugHelper.dylib
          ls -la output/iOSDebugHelper.dylib

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: iOSDebugHelper-dylib
          path: output/iOSDebugHelper.dylib

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: iOSDebugHelper-deb
          path: packages/*.deb
