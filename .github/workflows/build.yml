name: Build iOSDebugHelper

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Install Theos
        run: |
          sudo git clone --recursive https://github.com/theos/theos.git /opt/theos
          echo "THEOS=/opt/theos" >> $GITHUB_ENV

      - name: Clone FLEX dependency
        run: |
          mkdir -p Headers
          git clone --depth 1 https://github.com/FLEXTool/FLEX.git Headers/FLEX
          echo "=== FLEX directory structure ==="
          ls -la Headers/FLEX/
          echo "=== Find all .m files ==="
          find Headers/FLEX -name "*.m" ! -name "*Test*" | head -30

      - name: Build tweak
        run: |
          export THEOS=/opt/theos

          # 收集 FLEX 所有 .m 源文件
          FLEX_SOURCES=$(find Headers/FLEX -name "*.m" ! -name "*Test*" ! -name "main.m" | tr '\n' ' ')
          echo "FLEX sources count: $(echo $FLEX_SOURCES | wc -w)"

          # 获取 FLEX 头文件目录
          FLEX_INCLUDES=$(find Headers/FLEX -type d -name "*.framework" -prune -o -type d -print | grep -v ".git" | sed 's/^/-I/' | tr '\n' ' ')

          # 动态追加到 Makefile
          echo "iOSDebugHelper_FILES += $FLEX_SOURCES" >> Makefile
          echo "iOSDebugHelper_CFLAGS += $FLEX_INCLUDES -IHeaders/FLEX" >> Makefile

          make package THEOS=/opt/theos ARCHS="arm64" 2>&1 | tail -50

      - name: Extract dylib from deb
        if: success()
        run: |
          mkdir -p output
          DEB_FILE=$(ls packages/*.deb | head -1)
          echo "Extracting from: $DEB_FILE"
          dpkg-deb -x "$DEB_FILE" output/
          find output/ -name "*.dylib" -exec cp {} output/iOSDebugHelper.dylib \;
          ls -la output/

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: iOSDebugHelper-dylib
          path: output/iOSDebugHelper.dylib

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: iOSDebugHelper-deb
          path: packages/*.deb
